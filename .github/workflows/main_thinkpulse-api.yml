# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - thinkpulse-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and test
        run: |
          npm install
          npm run test --if-present

      - name: Prepare production bundle
        run: |
          # Wipe full devDeps tree and reinstall production-only deps so the
          # deploy package is lean (~3k files instead of ~30k).
          rm -rf node_modules
          npm ci --omit=dev

      - name: Create deployment zip
        run: |
          # Zip only the files needed at runtime. This avoids upload-artifact
          # file-count limits and hidden-file exclusion issues with node_modules/.bin.
          zip -r deploy.zip \
            server.js \
            package.json \
            package-lock.json \
            src/ \
            public/ \
            data/ \
            sql/ \
            node_modules/ \
            -x "*.env" "*.env.*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract deployment package
        run: |
          mkdir -p app
          unzip deploy.zip -d app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B3DBA56ED9A54D198C88B94B39E2E21E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AF4B958FFDF74FBF849CE37FF3BEEA16 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BCC0D1A44B5E4AD6965A28D1DB81401C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'thinkpulse-api'
          slot-name: 'Production'
          package: app
          